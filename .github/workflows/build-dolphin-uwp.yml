name: Build Dolphin UWP (Screen Borders)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Checkout SirMangler/dolphin (UWP-pre1.18) with submodules
        uses: actions/checkout@v4
        with:
          repository: SirMangler/dolphin
          ref: UWP-pre1.18
          path: dolphin
          submodules: recursive

      - name: Apply Screen Borders patch
        shell: pwsh
        run: |
          git -C dolphin apply --ignore-space-change --ignore-whitespace "${{ github.workspace }}/screen-borders.patch"
          git -C dolphin status --short

      - name: Patch project files for CI build (warnings, CppWinRT SDK match, disable desktop SDL2)
        shell: pwsh
        run: |
          $p = "dolphin/Source/VSProps/Base.props"
          (Get-Content $p) -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>' `
                           -replace '<TreatLinkerWarningAsErrors>true</TreatLinkerWarningAsErrors>', '<TreatLinkerWarningAsErrors>false</TreatLinkerWarningAsErrors>' |
            Set-Content $p

          # Disable desktop HAVE_SDL2 (Xbox UWP uses WGInput; avoids linking desktop GDI32 symbols from SDL2.lib)
          $bdp = "dolphin/Source/VSProps/Base.Dolphin.props"
          (Get-Content $bdp) -replace '<PreprocessorDefinitions>HAVE_SDL2;%\(PreprocessorDefinitions\)</PreprocessorDefinitions>', '' |
            Set-Content $bdp

          $sdlProps = "dolphin/Externals/SDL/exports.props"
          $sdlXml = Get-Content $sdlProps -Raw
          $sdlXml = $sdlXml -replace '(?s)<ProjectReference Include="\$\(ExternalsDir\)SDL\\SDL2\.vcxproj">.*?</ProjectReference>', ''
          Set-Content $sdlProps $sdlXml

          # Remove outdated NuGet CppWinRT 2.0.220110.5 (so DolphinWinRT matches DolphinLib's SDK C++/WinRT)
          # and remove SirMangler's broken local relative path to SDL-UWP.vcxproj
          $uwp = "dolphin/Source/DolphinWinRT/DolphinWinRT.vcxproj"
          $uwpXml = Get-Content $uwp -Raw
          $uwpXml = $uwpXml -replace '(?m)^.*Microsoft\.Windows\.CppWinRT\.2\.0\.220110\.5.*\r?\n?', ''
          $uwpXml = $uwpXml -replace '(?s)<ProjectReference Include="[^"]*SDL-UWP\.vcxproj">.*?</ProjectReference>', ''
          Set-Content $uwp $uwpXml

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DolphinWinRT (Release x64 MSIX/AppX Bundle)
        shell: pwsh
        run: |
          $sdkDir = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdk = (Get-ChildItem $sdkDir -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          Write-Host "Using WindowsTargetPlatformVersion=$sdk"
          msbuild dolphin/Source/dolphin-emu.sln `
            /t:DolphinWinRT `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=$sdk `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms=x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /m

      - name: Collect Xbox packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          Get-ChildItem -Path dolphin -Recurse -Include *.msix,*.msixbundle,*.appx,*.appxbundle,*.cer |
            Where-Object { $_.FullName -match 'AppPackages' } |
            ForEach-Object {
              Write-Host "Found package: $($_.FullName)"
              Copy-Item $_.FullName -Destination output/
            }
          Get-ChildItem output

      - name: Upload Dolphin UWP Xbox Package
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-UWP-ScreenBorders-x64
          path: output/
